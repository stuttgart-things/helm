---
name: Lint yaml files
on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'renovate/**'
  pull_request:
    types: [opened, reopened]

jobs:
  Analyze-Changed-Charts:
    container:
      image: ghcr.io/stuttgart-things/machineshop/machineshop-9c3178088556daa12a17db5edcc6b5b7:latest
    environment: k8s
    permissions:
      contents: read
      pull-requests: read
    #outputs:
      #collection_folders: ${{ steps.changed-files.outputs.collection_folders }}
    # GRUPPENLABEL, NICHT EIN RUNNER-NAME.
    #
    # Hier stand kind-testing-runner-1 — ein einzelner Rechner, adressiert
    # ueber sein runner-eigenes Label. Das war seinerseits schon der Fix fuer
    # ein Queueing-Problem (b5aaf91, 2026-07-03: ghr-helm-skyami-cicd war
    # offline), hat aber nur einen Einzel-Runner gegen einen anderen getauscht
    # und damit denselben Ausfallmodus wieder eingebaut.
    #
    # Am 2026-08-21 erneut zugeschlagen: der taegliche content-gaps-Cron in
    # stuttgart-things/rank5 fragte nach kind-testing-labda, der Scheduler
    # legte ihn auf runner-1, und jeder Check hier wartete — waehrend
    # kind-testing-runner-2 mit identischen Labels danebenstand und idle war.
    #
    # kind-testing-labda tragen beide Runner. Damit nimmt der Job, wer frei
    # ist, und ein einzelner offline gegangener Runner blockiert nichts mehr.
    runs-on: kind-testing-labda
    steps:
      - name: Get Modified Files by PullRequest
        id: changed-files
        if: github.event_name == 'pull_request'
        env:
          # Use the auto-provided workflow token; secrets.GH_TOKEN was empty for
          # this environment, leaving the API call unauthenticated.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Guard jq against non-array responses (e.g. an API error object),
          # which previously crashed the step with "Cannot index string".
          FILES=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.event.pull_request.url }}/files" \
            | jq -r 'if type == "array" then .[].filename else empty end')
          echo "Changed files:"
          echo "${FILES}"

  renovate-annotations:
    name: Templated chart versions are visible to Renovate
    # Gruppenlabel wie bei den anderen Jobs — siehe Analyze-Changed-Charts.
    runs-on: kind-testing-labda
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check "# renovate:" annotations
        run: ./hack/check-chart-annotations.sh

  yaml-lint:
    name: Lint yaml files
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-yaml-lint.yaml@main
    with:
      environment-name: k8s
      # Gruppenlabel wie oben — siehe die Begruendung bei Analyze-Changed-Charts.
      runs-on: kind-testing-labda
      continue-error: true
      yamllint-version: 1
      lintprofile-path: .yamllint
      artifact-name: yaml-lint
